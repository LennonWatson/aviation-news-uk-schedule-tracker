name: Hourly airline schedule scan

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explain collector status
        run: |
          echo "Collector is not enabled yet."
          echo "Connect an approved official or licensed timetable source before publishing changes."
