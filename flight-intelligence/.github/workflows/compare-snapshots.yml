name: Compare approved flight snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare synthetic example snapshots
        run: python scripts/compare_flights.py examples/before.json examples/after.json
